<!doctype html>
<html lang="sk">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>bod.legal | AI kontrola zmlúv s overením advokátskou kanceláriou alebo advokátom</title>
    <meta name="description" content="Nahrajte zmluvu a do 24 hodín dostanete report s identifikovanými rizikami, odkazmi na právne predpisy a návrhmi úprav. Každý report overuje advokátska kancelária alebo advokát." />
    <!-- Otvorene pre vyhladavace 17. 7. 2026 po potvrdeni advokata
         (cennik, garancia, pausal a podpisove formuly schvalene). -->
    <meta name="robots" content="index, follow" />
    <!-- Canonical patri routeru: kazda cesta servuje tento subor, takze
         staticky canonical by z podstranok spravil duplikaty domovskej. -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="bod.legal | AI kontrola zmlúv s overením advokátskou kanceláriou alebo advokátom" />
    <meta property="og:description" content="Nahrajte zmluvu a do 24 hodín dostanete report s identifikovanými rizikami, odkazmi na právne predpisy a návrhmi úprav." />
    <meta property="og:url" content="https://app.bod.legal/" />
    <meta property="og:site_name" content="bod.legal" />
    <meta property="og:locale" content="sk_SK" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="bod.legal | AI kontrola zmlúv" />
    <meta name="twitter:description" content="Nahrajte zmluvu a do 24 hodín dostanete report s identifikovanými rizikami a návrhmi úprav." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: self-hosted so no visitor IP leaks to Google before cookie
         consent (the marketing site self-hosts them for the same reason). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LegalService",
      "name": "bod.legal",
      "description": "AI kontrola zmlúv s overením advokátskou kanceláriou alebo advokátom. Report do 24 hodín.",
      "url": "https://app.bod.legal",
      "provider": {
        "@type": "Organization",
        "name": "KILIAN LEGAL s. r. o.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hrudky 1401/46A",
          "addressLocality": "Chorvátsky Grob",
          "postalCode": "900 25",
          "addressCountry": "SK"
        },
        "telephone": "+421917333692",
        "email": "info@bod.legal"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "reviewCount": "70",
        "bestRating": "5",
        "worstRating": "1"
      },
      "priceRange": "249-490 EUR",
      "areaServed": {
        "@type": "Country",
        "name": "Slovakia"
      },
      "serviceType": ["Kontrola zmlúv", "Právna analýza", "AI právne služby"]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Load analytics only if the user accepted cookies AND the build-time
      // analytics vars were actually set. Otherwise the %VITE_...% placeholders
      // ship literally and would fire a request to a broken URL.
      (function () {
        var endpoint = '%VITE_ANALYTICS_ENDPOINT%';
        var websiteId = '%VITE_ANALYTICS_WEBSITE_ID%';
        var configured = endpoint.indexOf('%VITE_') !== 0 && websiteId.indexOf('%VITE_') !== 0;
        if (configured && localStorage.getItem('bod_cookie_consent') === 'accepted') {
          var s = document.createElement('script');
          s.defer = true;
          s.src = endpoint + '/umami';
          s.setAttribute('data-website-id', websiteId);
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>

</html>
