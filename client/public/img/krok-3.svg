<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Podpisany report">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1B33"/>
      <stop offset="1" stop-color="#0A1428"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C776"/>
      <stop offset="1" stop-color="#C9973F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.03">
    <path d="M0 150 H800 M0 300 H800 M0 450 H800"/>
    <path d="M200 0 V600 M400 0 V600 M600 0 V600"/>
  </g>
  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#FFFFFF" fill-opacity="0.08">bod.legal</text>
  <!-- report document -->
  <rect x="250" y="95" width="300" height="400" rx="16" fill="#101F3C" stroke="#2A3B5E" stroke-width="2"/>
  <!-- header band -->
  <rect x="250" y="95" width="300" height="58" rx="16" fill="#1A2C50"/>
  <rect x="250" y="130" width="300" height="23" fill="#1A2C50"/>
  <text x="278" y="132" font-family="Georgia, serif" font-size="22" fill="#E8C776">Report</text>
  <!-- text lines -->
  <g stroke="#3D4F76" stroke-width="8" stroke-linecap="round">
    <path d="M280 190 H520"/>
    <path d="M280 224 H490"/>
    <path d="M280 258 H520"/>
    <path d="M280 292 H450"/>
  </g>
  <!-- signature line -->
  <path d="M280 415 H430" stroke="#3D4F76" stroke-width="3"/>
  <!-- handwritten signature -->
  <path d="M288 404 c10 -22 22 -26 26 -10 c4 14 -10 18 -2 4 c10 -18 24 -22 30 -6 c5 12 14 10 24 -4 c8 -11 18 -8 24 2" fill="none" stroke="#E8C776" stroke-width="4" stroke-linecap="round"/>
  <text x="280" y="442" font-family="Arial, sans-serif" font-size="15" fill="#8FA0C4">Advokat, SAK</text>
  <!-- seal with checkmark -->
  <g>
    <circle cx="505" cy="390" r="64" fill="#0A1428" stroke="url(#gold3)" stroke-width="5"/>
    <circle cx="505" cy="390" r="50" fill="none" stroke="#E8C776" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M478 392 l18 18 l36 -40" fill="none" stroke="url(#gold3)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- ribbon -->
  <path d="M482 445 l-14 44 l20 -12 l14 18 l12 -40" fill="#C9973F" fill-opacity="0.85"/>
  <path d="M528 445 l14 44 l-20 -12 l-14 18 l-8 -34" fill="#E8C776" fill-opacity="0.7"/>
</svg>
